# =============================================================================
# SONARCLOUD CONFIGURATION FILE — sonar-project.properties
# =============================================================================
# What is this file?
#   This file tells SonarCloud (the free cloud version of SonarQube) HOW to
#   scan our project. It defines which files to scan, which to ignore,
#   and basic project metadata.
#
# How does it work?
#   When GitHub Actions runs, the SonarCloud scanner reads this file and uses
#   it as a "map" to know where to look for source code, tests, and reports.
#
# Where does SonarCloud run?
#   It runs INSIDE our GitHub Actions CI pipeline — NOT on EC2 or locally.
#   It sends results to https://sonarcloud.io → you can see bugs there.
# =============================================================================

# ─── Project Identity ────────────────────────────────────────────────────────
# sonar.organization = your SonarCloud org (from sonarcloud.io → My Account → Organizations)
# sonar.projectKey   = unique key for THIS project on SonarCloud dashboard
sonar.organization=aadil86438
sonar.projectKey=Aadil86438_aadil-crm
sonar.projectName=Aadil CRM
sonar.projectVersion=1.0

# ─── Source Code Locations ───────────────────────────────────────────────────
# Tell Sonar WHERE our actual source code lives.
# We have two sub-projects: backend (Go) and frontend (Vue.js)
sonar.sources=backend,frontend/src

# ─── Language Settings ───────────────────────────────────────────────────────
# Our backend is Go, our frontend is JavaScript/Vue
# SonarCloud auto-detects, but we can be explicit
sonar.go.file.suffixes=.go
sonar.javascript.file.suffixes=.js,.vue

# ─── Exclusions ─────────────────────────────────────────────────────────────
# These folders are EXCLUDED from scanning because:
#   - node_modules → 3rd party code (not ours) — scanning it would be noise
#   - dist         → compiled/built output (not source code)
#   - vendor       → Go vendored dependencies (not our code)
#   - *.pb.go      → auto-generated protobuf files (not hand-written)
#   - seed.exe     → compiled binary (not source)
sonar.exclusions=\
  frontend/node_modules/**,\
  frontend/dist/**,\
  backend/vendor/**,\
  **/*.pb.go,\
  backend/seed.exe,\
  **/migrations/*.sql

# ─── Test Exclusions ─────────────────────────────────────────────────────────
# Don't count test files themselves as "application code" — they skew metrics
sonar.test.exclusions=**/*_test.go,**/*.test.js,**/*.spec.js

# ─── Encoding ────────────────────────────────────────────────────────────────
# Standard UTF-8 for source files
sonar.sourceEncoding=UTF-8
