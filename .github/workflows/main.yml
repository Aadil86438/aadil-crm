# =============================================================================
# GITHUB ACTIONS CI/CD PIPELINE — main.yml
# =============================================================================
# Direct deployment to AWS EC2 on push to main branch
# =============================================================================

name: CRM CI/CD — Direct Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  deploy:
    name: 🚀 Deploy to AWS EC2 (Production)
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - name: 🚀 Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -e

            if [ ! -d "/home/ubuntu/aadil-crm/.git" ]; then
              echo "📥 First time setup: Cloning repository to EC2..."
              git clone https://github.com/Aadil86438/aadil-crm.git /home/ubuntu/aadil-crm
            else
              echo "🔄 Pulling latest changes from main branch..."
              cd /home/ubuntu/aadil-crm
              git fetch origin
              git reset --hard origin/main
            fi

            cd /home/ubuntu/aadil-crm

            if [ ! -f ".env" ]; then
              echo "❌ ERROR: .env file missing in /home/ubuntu/aadil-crm!"
              exit 1
            fi

            echo "🐳 Rebuilding and restarting Docker containers..."
            docker compose down --remove-orphans
            docker compose up -d --build

            echo "✅ Deployment complete! Checking running containers..."
            docker compose ps
