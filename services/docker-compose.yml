# ============================================================
# LOCAL MICROSERVICES DEVELOPMENT COMPOSE
# Simulates multi-cloud on your local machine:
#   core-service-aws  → Port 8080 (simulates AWS EC2)
#   admin-service-gcp → Port 8081 (simulates GCP VM)
# ============================================================

version: '3.8'

services:
  # ── Shared PostgreSQL (only core-service-aws connects to DB) ──
  postgres:
    image: postgres:15-alpine
    container_name: ms-postgres
    environment:
      POSTGRES_DB: employee_db
      POSTGRES_USER: dev_user
      POSTGRES_PASSWORD: dev_pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev_user -d employee_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Shared Redis ──────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: ms-redis
    ports:
      - "6379:6379"

  # ── Microservice 1: core-service-aws (Simulates AWS EC2) ─────
  core-service-aws:
    build:
      context: ./core-service-aws
      dockerfile: Dockerfile
    container_name: ms-core-aws
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      APP_ENV: development
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: employee_db
      DB_USER: dev_user
      DB_PASSWORD: dev_pass
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      JWT_SECRET: local_dev_jwt_secret_change_me
      FRONTEND_URL: "http://localhost:5173"
      # THIS IS THE KEY: shared secret between both microservices
      INTERNAL_SERVICE_KEY: local_dev_internal_secret_2024
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  # ── Microservice 2: admin-service-gcp (Simulates GCP VM) ─────
  admin-service-gcp:
    build:
      context: ./admin-service-gcp
      dockerfile: Dockerfile
    container_name: ms-admin-gcp
    ports:
      - "8081:8081"
    environment:
      PORT: "8081"
      APP_ENV: development
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      JWT_SECRET: local_dev_jwt_secret_change_me
      FRONTEND_URL: "http://localhost:5173"
      # This is where admin-service-gcp calls core-service-aws
      # In local: points to Docker service name
      # In production: points to AWS EC2 public IP/domain
      CORE_SERVICE_URL: "http://core-service-aws:8080"
      # MUST MATCH the INTERNAL_SERVICE_KEY in core-service-aws!
      INTERNAL_SERVICE_KEY: local_dev_internal_secret_2024
    depends_on:
      - core-service-aws
      - redis

volumes:
  pgdata:
