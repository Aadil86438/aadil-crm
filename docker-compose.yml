version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: crm_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: crm
      POSTGRES_USER: crm_user
      POSTGRES_PASSWORD: "2466"
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - crm_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm_user -d crm"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crm_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: production
      PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: crm
      DB_USER: crm_user
      DB_PASSWORD: "2466"
      JWT_SECRET: "${JWT_SECRET:-change_me_in_production}"
      JWT_EXPIRATION: 24h
      FRONTEND_URL: "http://localhost:8081"
    ports:
      - "8080:8080"
    networks:
      - crm_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: crm_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VUE_APP_API_URL: "http://localhost:8080"
    ports:
      - "8081:80"
    networks:
      - crm_net

volumes:
  pgdata:

networks:
  crm_net:
    driver: bridge
