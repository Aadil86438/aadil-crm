# =============================================================================
# FOSSA CONFIGURATION FILE — .fossa.yml
# =============================================================================
# What is this file?
#   This file configures FOSSA — the license compliance and security
#   vulnerability scanner for our dependencies.
#
# What does FOSSA actually DO here?
#   1. Reads frontend/package.json → finds all npm packages (axios, vue, etc.)
#   2. Reads backend/go.mod       → finds all Go modules (jwt, pq, redis, etc.)
#   3. For each package, it checks:
#      a) WHAT LICENSE does this package use? (MIT, GPL, Apache, etc.)
#      b) Does any package have a known CVE (security vulnerability)?
#   4. If a "bad" license (like GPL) or vulnerability is found → CI fails
#
# Why does this matter for our CRM?
#   Our CRM is a COMMERCIAL product (sold at ₹399). If we accidentally use
#   a GPL-licensed library, we'd legally need to open-source our ENTIRE product.
#   FOSSA catches this BEFORE deployment automatically.
#
# Where does FOSSA run?
#   Inside GitHub Actions → sends report to https://app.fossa.com
# =============================================================================

version: 1

# ─── Project Metadata ────────────────────────────────────────────────────────
# Tells FOSSA what this project is called on their dashboard
cli:
  server: https://app.fossa.com
  fetcher: git
  project: Aadil86438/aadil-crm

# ─── What to Scan ────────────────────────────────────────────────────────────
# We specify each sub-project separately because we have:
#   - frontend: Node.js/npm project (Vue.js)
#   - backend:  Go modules project
analyze:
  modules:

    # ── Frontend (Vue.js / npm) ──────────────────────────────────────────────
    # FOSSA reads frontend/package.json and ALL transitive dependencies
    # (i.e., not just what you wrote, but what your packages depend on too)
    - name: crm-frontend
      type: npm               # ← npm ecosystem
      target: frontend        # ← folder to scan
      path: frontend          # ← where package.json lives

    # ── Backend (Go modules) ────────────────────────────────────────────────
    # FOSSA reads backend/go.mod to discover all Go dependencies
    # (jwt, redis client, postgres driver, bcrypt, etc.)
    - name: crm-backend
      type: go                # ← Go ecosystem
      target: backend         # ← folder to scan
      path: backend           # ← where go.mod lives
